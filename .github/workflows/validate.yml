name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane: [contracts, native, web, security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - run: npm install --global pnpm@11.25.0
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.lane == 'security'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Install pinned Dioxus CLI
        shell: pwsh
        run: |
          $taskDxZip = Join-Path $env:RUNNER_TEMP 'dx.zip'
          $taskDxDir = Join-Path $env:RUNNER_TEMP 'dx'
          Invoke-WebRequest 'https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-pc-windows-msvc.zip' -OutFile $taskDxZip
          if ((Get-FileHash -LiteralPath $taskDxZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '45eb4f87b7f86fdba8508ee7e0ef1f9e13cf8f2ffcc6a2d5858d0e8ea7dd1531') { throw 'Dioxus checksum mismatch' }
          Expand-Archive -LiteralPath $taskDxZip -DestinationPath $taskDxDir
          $taskDxDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: matrix.lane == 'web'
        run: pnpm exec playwright install chromium
      - run: node scripts/ci-verify.mjs --lane ${{ matrix.lane }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ matrix.lane }}
          path: target/ci-reports/
          if-no-files-found: error
          retention-days: 7
