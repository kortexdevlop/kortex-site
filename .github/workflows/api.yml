name: Deploy API
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'database/**'
      - 'shared/**'
      - 'web-adapter/src/archive.ts'
      - 'web-adapter/src/wasm-check.ts'
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        type: boolean
        default: false
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-api-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.KORTEX_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'staging' }}
    env:
      KORTEX_DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node api/scripts/generate-validators.mjs
      - run: node web-adapter/generate-validators.mjs
      - run: node scripts/ci-deploy.mjs api ${{ env.KORTEX_DEPLOY_ENV }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: inputs.rehearse_rollback && env.KORTEX_DEPLOY_ENV == 'staging'
        run: node scripts/rehearse-staging-rollback.mjs api
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-api
          path: target/ci-reports/deploy/
          retention-days: 7
