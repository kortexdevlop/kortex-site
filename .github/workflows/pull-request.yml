name: Review checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - run: node scripts/check-progress.mjs
      - run: node scripts/check-env.mjs --example
      - run: node --test tests/config/secrets.test.mjs
      - run: git diff --check
# Protection manuelle : exiger ce job, revue CODEOWNERS et interdire le contournement.
# Aucun secret, déploiement, publication ou permission d'écriture.
