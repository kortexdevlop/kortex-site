[package]
name = "kortex-dioxus-render-spike"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
serde_json = "=1.0.154"
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web", "dep:web-sys"]
[profile.dev]
debug = 0
incremental = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", optional = true, features = ["Location"] }
