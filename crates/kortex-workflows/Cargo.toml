[package]
name="kortex-workflows"
version="1.0.0"
edition.workspace=true
rust-version.workspace=true
publish=false
[dependencies]
kortex-core={path="../kortex-core"}
kortex-abi={path="../kortex-abi"}
kortex-shared={path="../../shared/rust"}
kortex-capabilities={path="../kortex-capabilities"}
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.154"
jsonschema={version="=0.60.0",default-features=false}
sha2="=0.11.1"
[dev-dependencies]
ed25519-dalek={version="=2.2.0"}
kortex-runtime-native={path="../kortex-runtime-native"}
kortex-verify={path="../kortex-verify"}
tokio={version="=1.54.1",features=["rt","time"]}
