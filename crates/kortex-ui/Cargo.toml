[package]
name = "kortex-ui"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "mounted"] }
serde_json = "=1.0.154"
jsonschema = { version = "=0.60.0", default-features = false }
[dev-dependencies]
dioxus-ssr = "=0.7.10"
dioxus-html = { version = "=0.7.10", features = ["serialize"] }
