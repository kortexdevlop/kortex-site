[package]
name="kortex-runtime-native"
version="1.0.0"
edition.workspace=true
rust-version.workspace=true
publish=false
[dependencies]
kortex-core={path="../kortex-core"}
kortex-abi={path="../kortex-abi"}
serde_json="=1.0.154"
wasmtime={version="=50.0.0",default-features=false,features=["runtime","cranelift","std","wat"]}
zip={version="=9.0.0",default-features=false,features=["deflate"]}
ed25519-dalek="=2.2.0"
sha2="=0.10.9"
kortex-capabilities={path="../kortex-capabilities"}
kortex-sdk={path="../kortex-sdk"}
serde={version="=1.0.229",features=["derive"]}
base64="=0.23.1"
dirs="=6.0.0"
fs2="=0.4.3"
rfd="=0.17.2"
reqwest={version="=0.12.28",default-features=false,features=["blocking","rustls-tls"]}
url="=2.5.8"
futures-channel="=0.3.34"
getrandom="=0.3.4"
arboard={version="=3.6.1",default-features=false}
kortex-pack={path="../kortex-pack"}
