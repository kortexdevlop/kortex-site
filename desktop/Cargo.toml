[package]
name="kortex-desktop"
version="1.0.0"
edition.workspace=true
rust-version.workspace=true
publish=false
[dependencies]
dioxus={version="=0.7.10",default-features=false,features=["macro","html","signals","hooks","launch","desktop"]}
kortex-runtime-desktop={path="../runtime/desktop"}
kortex-runtime-native={path="../crates/kortex-runtime-native"}
kortex-core={path="../crates/kortex-core"}
kortex-workflows={path="../crates/kortex-workflows"}
kortex-capabilities={path="../crates/kortex-capabilities"}
kortex-ui={path="../crates/kortex-ui"}
kortex-verify={path="../crates/kortex-verify"}
kortex-shared={path="../shared/rust"}
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.154"
jsonschema={version="=0.60.1",default-features=false}
reqwest={version="=0.12.28",default-features=false,features=["blocking","rustls-tls"]}
url="=2.5.8"
dirs="=6.0.0"
tokio={version="=1.54.1",features=["rt","time"]}
fs2="=0.4.3"
semver="=1.0.28"
getrandom="=0.3.4"
sha2="=0.10.9"
base64="=0.22.1"
zeroize="=1.9.1"
webbrowser="=1.2.5"
[target.'cfg(windows)'.dependencies]
windows-sys={version="=0.61.2",features=["Win32_Security_Credentials","Win32_Foundation"]}
[dev-dependencies]
ed25519-dalek="=2.2.0"
kortex-pack={path="../crates/kortex-pack"}
zip={version="=9.0.0",default-features=false,features=["deflate"]}
wat="=1.262.0"
tempfile="=3.27.0"
